<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Word Family Train Adventure</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body{
      width:100vw;
      height:100vh;
      overflow:hidden;
      background:#dff4ff;
    }

    #splash{
      position:fixed;
      inset:0;
      background:white;
      display:flex;
      justify-content:center;
      align-items:center;
      z-index:999;
    }

    #splash img{
      width:220px;
      max-width:70vw;
    }

    #game{
      width:100%;
      height:100%;
      display:none;
      flex-direction:column;
      justify-content:space-between;
      padding:8px;
      background:
      linear-gradient(to bottom,#dff4ff,#fff6d8);
    }

    #instructions{
      background:#fff3bf;
      padding:10px;
      border-radius:14px;
      text-align:center;
      font-weight:bold;
      color:#333;
      line-height:1.4;
      font-size:16px;
    }

    #topArea{
      height:30%;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    #card{
      width:170px;
      background:white;
      border-radius:18px;
      padding:10px;
      box-shadow:0 4px 10px rgba(0,0,0,0.15);
      text-align:center;
      position:relative;
    }

    #card img{
      width:90px;
      height:90px;
      object-fit:contain;
      pointer-events:none;
    }

    #word{
      margin-top:8px;
      font-size:30px;
      font-weight:bold;
      color:#444;
    }

    #trainArea{
      height:42%;
      display:flex;
      gap:10px;
    }

    .train{
      flex:1;
      border-radius:22px;
      border:4px dashed #777;
      background:white;
      display:flex;
      justify-content:center;
      align-items:center;
      text-align:center;
      font-size:28px;
      font-weight:bold;
      color:#444;
      position:relative;
    }

    #feedback{
      position:fixed;
      inset:0;
      display:none;
      justify-content:center;
      align-items:center;
      font-size:110px;
      z-index:1000;
      pointer-events:none;
    }

    #endScreen{
      position:fixed;
      inset:0;
      background:rgba(255,255,255,0.96);
      display:none;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      gap:20px;
      z-index:1000;
    }

    #endScreen h1{
      color:#444;
      font-size:42px;
    }

    #replayBtn{
      padding:14px 28px;
      border:none;
      border-radius:14px;
      background:#ffd166;
      font-size:22px;
    }

    #startBtn{
      position:fixed;
      bottom:20px;
      left:50%;
      transform:translateX(-50%);
      z-index:2000;
      padding:14px 28px;
      border:none;
      border-radius:14px;
      background:#ffcf70;
      font-size:22px;
      font-weight:bold;
    }

    @media(max-width:768px){

      #instructions{
        font-size:14px;
      }

      #card{
        width:140px;
      }

      #word{
        font-size:26px;
      }

      .train{
        font-size:22px;
      }

      #feedback{
        font-size:90px;
      }

    }

  </style>
</head>

<body>

<!-- SPLASH -->

<div id="splash">
  <img src="assets/innovine-logo.png">
</div>

<!-- START BUTTON -->

<button id="startBtn">Start Game</button>

<!-- GAME -->

<div id="game">

  <div id="instructions">
    Drag and drop the word into the correct train.<br>
    Put -at words in the -at train.<br>
    Put -an words in the -an train.
  </div>

  <div id="topArea">

    <div id="card">
      <img id="image">
      <div id="word"></div>
    </div>

  </div>

  <div id="trainArea">

    <div class="train" id="atTrain" data-family="at">
      🚂 -AT TRAIN
    </div>

    <div class="train" id="anTrain" data-family="an">
      🚂 -AN TRAIN
    </div>

  </div>

</div>

<div id="feedback"></div>

<div id="endScreen">
  <h1>🎉 Great Job! 🎉</h1>
  <button id="replayBtn">Replay</button>
</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="bgMusic" loop src="assets/background-music.mp3"></audio>

<script>

const words = [

  {word:"hat",family:"at",image:"assets/hat.png"},
  {word:"fan",family:"an",image:"assets/fan.png"},
  {word:"cat",family:"at",image:"assets/cat.jpg"},
  {word:"pan",family:"an",image:"assets/pan.png"},
  {word:"bat",family:"at",image:"assets/bat.jpg"},
  {word:"van",family:"an",image:"assets/van.png"},
  {word:"mat",family:"at",image:"assets/mat.png"},
  {word:"man",family:"an",image:"assets/man.png"},
  {word:"rat",family:"at",image:"assets/rat.png"},
  {word:"can",family:"an",image:"assets/can.png"},
  {word:"fat",family:"at",image:"assets/fat.png"},
  {word:"tan",family:"an",image:"assets/tan.png"},
  {word:"sat",family:"at",image:"assets/sat.png"},
  {word:"ran",family:"an",image:"assets/ran.png"},
  {word:"pat",family:"at",image:"assets/pat.png"},
  {word:"plan",family:"an",image:"assets/plan.png"},
  {word:"chat",family:"at",image:"assets/chat.png"},
  {word:"swan",family:"an",image:"assets/swan.png"}

];

let current = 0;

const splash = document.getElementById("splash");
const game = document.getElementById("game");
const startBtn = document.getElementById("startBtn");

const image = document.getElementById("image");
const word = document.getElementById("word");

const card = document.getElementById("card");

const feedback = document.getElementById("feedback");

const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");
const bgMusic = document.getElementById("bgMusic");

const endScreen = document.getElementById("endScreen");
const replayBtn = document.getElementById("replayBtn");

setTimeout(()=>{

  splash.style.display="none";

},5000);

startBtn.addEventListener("click",()=>{

  startBtn.style.display="none";

  game.style.display="flex";

  speakInstructions();

});

function speakInstructions(){

  const speech = new SpeechSynthesisUtterance(
    "Drag and drop the word into the correct train. Put at words in the at train. Put an words in the an train."
  );

  speech.rate = 0.9;

  speech.onend = ()=>{

    bgMusic.volume = 0.2;

    bgMusic.play();

    loadWord();
  };

  speechSynthesis.speak(speech);

}

function loadWord(){

  if(current >= words.length){

    finishGame();
    return;
  }

  const item = words[current];

  image.src = item.image;

  word.innerText = item.word;

  speakWord(item.word);
}

function speakWord(text){

  const speech = new SpeechSynthesisUtterance(text);

  speech.rate = 0.8;

  speechSynthesis.speak(speech);
}

/* TOUCH BASED DRAGGING */

let activeTrain = null;

card.addEventListener("touchmove",(e)=>{

  const touch = e.touches[0];

  const target =
  document.elementFromPoint(touch.clientX,touch.clientY);

  if(target && target.classList.contains("train")){

    activeTrain = target;
  }

});

card.addEventListener("touchend",()=>{

  if(activeTrain){

    checkAnswer(activeTrain.dataset.family);
  }

  activeTrain = null;

});

/* MOUSE DRAGGING */

card.draggable = true;

card.addEventListener("dragstart",(e)=>{

  e.dataTransfer.setData("text/plain","drag");

});

document.querySelectorAll(".train").forEach(train=>{

  train.addEventListener("dragover",(e)=>{

    e.preventDefault();

  });

  train.addEventListener("drop",(e)=>{

    e.preventDefault();

    checkAnswer(train.dataset.family);

  });

});

function checkAnswer(choice){

  const correct = words[current].family;

  if(choice === correct){

    correctSound.currentTime = 0;
    correctSound.play();

    showFeedback("👏");

    current++;

    setTimeout(()=>{

      loadWord();

    },1000);

  }else{

    wrongSound.currentTime = 0;
    wrongSound.play();

    showFeedback("❌");

  }

}

function showFeedback(icon){

  feedback.style.display="flex";

  feedback.innerHTML = icon;

  setTimeout(()=>{

    feedback.style.display="none";

  },900);

}

function finishGame(){

  bgMusic.pause();

  const speech =
  new SpeechSynthesisUtterance(
    "Great job. You finished the game."
  );

  speechSynthesis.speak(speech);

  endScreen.style.display="flex";

}

replayBtn.addEventListener("click",()=>{

  current = 0;

  endScreen.style.display="none";

  bgMusic.currentTime = 0;

  bgMusic.play();

  loadWord();

});

</script>

</body>
</html>
